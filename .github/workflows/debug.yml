name: Debug pydantic-ai capture
on:
  push:
    branches: [debug]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      PY: .venv/bin/python
    steps:
      - uses: actions/checkout@v7
        with:
          path: wirecheck
      - uses: actions/checkout@v7
        with:
          repository: pydantic/pydantic-ai
          ref: e286b84a1302849da685eeeeefcf2f4b12662d45
          path: target
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - working-directory: target
        run: |
          uv sync --frozen
          uv pip install --python "$PY" "$GITHUB_WORKSPACE/wirecheck"
          uv pip install --python "$PY" --no-deps "anthropic>=2.0.0"
      - working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/wirecheck/debug
        run: |
          set +e
          "$PY" -m pytest --wirecheck -p wc_debug -p no:cacheprovider -s -v \
            "tests/models/test_anthropic.py::test_anthropic_sampling_settings_reach_the_wire" 2>&1 | head -150
          echo "---- plugins and addopts"
          "$PY" -m pytest --version -VV 2>&1 | head -5
          grep -n -A15 "ini_options" pyproject.toml | grep -n -E "addopts|-p " || true
          grep -rn "AsyncClient.send\|Client.send =" tests/conftest.py pydantic_ai_slim/pydantic_ai | head -20 || true
