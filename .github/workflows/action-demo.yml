name: Action demo

# Runs this repo's own Action on the demo folder, so a pull request that
# touches the demo gets a WireCheck findings comment.

on:
  pull_request:
    paths:
      - "demo/**"
      - "action.yml"
      - "src/**"
      - ".github/workflows/action-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  wirecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "anthropic>=2.0.0"
      - uses: ./
        with:
          path: demo
          pytest-args: demo -q -p no:cacheprovider
