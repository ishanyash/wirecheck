name: Release

# Publish a GitHub release with a tag like v0.1.0 (Releases > Draft a new release).
# This builds, publishes to PyPI with trusted publishing (no API token stored
# anywhere), installs it back from PyPI and re-runs the demo.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-wirecheck/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip install pytest-wirecheck from PyPI
        run: |
          v=${GITHUB_REF_NAME#v}
          for i in $(seq 1 20); do
            python -m pip install --no-cache-dir "pytest-wirecheck==$v" "anthropic>=2.0.0" && break
            echo "not on PyPI yet, waiting"; sleep 15
          done
          python -m pip show pytest-wirecheck anthropic | grep -E "^(Name|Version)"
      - name: Demo against the PyPI package
        working-directory: demo
        run: |
          python -m pytest broken -q -p no:cacheprovider
          set +e
          python -m pytest broken --wirecheck -q -p no:cacheprovider | tee out.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" = "1" && grep -q "3 failed" out.txt
          python -m pytest fixed --wirecheck -q -p no:cacheprovider
