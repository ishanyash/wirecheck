name: Real repo check

# Run WireCheck against someone else's public repo at a fixed commit:
# install it the way its own CI does, add WireCheck, run the static scan and
# pytest --wirecheck. Results go to the job summary, the log and an artifact.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/name of the public repo"
        required: true
      ref:
        description: "commit SHA to check"
        required: true
      setup:
        description: "bash run inside the repo to install it and WireCheck ($WIRECHECK is WireCheck's path)"
        required: true
        default: 'python -m pip install -e . && python -m pip install "$WIRECHECK"'
      python-cmd:
        description: "python that runs pytest (for example .venv/bin/python)"
        required: false
        default: "python"
      anthropic:
        description: "optional pip spec to force, for example anthropic>=2.0.0 (empty keeps the repo's own pin)"
        required: false
        default: ""
      pytest-args:
        description: "extra pytest arguments"
        required: false
        default: ""
      python:
        description: "Python version"
        required: false
        default: "3.12"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPO: ${{ inputs.repo }}
      REF: ${{ inputs.ref }}
      SETUP: ${{ inputs.setup }}
      PY: ${{ inputs.python-cmd }}
      ANTHROPIC_SPEC: ${{ inputs.anthropic }}
      PYTEST_ARGS: ${{ inputs.pytest-args }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: wirecheck
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python }}
      - name: Install the repo and WireCheck
        working-directory: target
        run: |
          export WIRECHECK="$GITHUB_WORKSPACE/wirecheck"
          python -m pip install --quiet --upgrade pip uv
          bash -euo pipefail -c "$SETUP"
          if [ -n "$ANTHROPIC_SPEC" ]; then
            "$PY" -m pip install "$ANTHROPIC_SPEC" 2>/dev/null || uv pip install --python "$PY" "$ANTHROPIC_SPEC"
          fi
          "$PY" -m pip show anthropic pytest-wirecheck 2>/dev/null | grep -E "^(Name|Version)" \
            || uv pip show --python "$PY" anthropic pytest-wirecheck | grep -E "^(Name|Version)"
          echo "commit: $(git rev-parse HEAD)"
      - name: wirecheck scan
        working-directory: target
        run: |
          "$PY" -m wirecheck scan . --fail-on never
          "$PY" -m wirecheck scan . --fail-on never --format json -o "$RUNNER_TEMP/scan.json"
      - name: pytest --wirecheck
        id: pytest
        working-directory: target
        run: |
          read -r -a extra <<< "$PYTEST_ARGS"
          set +e
          "$PY" -m pytest --wirecheck --wirecheck-report "$RUNNER_TEMP/pytest.json" -p no:cacheprovider "${extra[@]}"
          echo "exit=$?" | tee -a "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        working-directory: target
        env:
          PYTEST_EXIT: ${{ steps.pytest.outputs.exit }}
        run: |
          args=(--scan "$RUNNER_TEMP/scan.json" -o "$RUNNER_TEMP/summary.md")
          [ -f "$RUNNER_TEMP/pytest.json" ] && args+=(--pytest "$RUNNER_TEMP/pytest.json")
          [ -n "$PYTEST_EXIT" ] && args+=(--pytest-exit "$PYTEST_EXIT")
          "$PY" -m wirecheck comment "${args[@]}"
          { echo "## $REPO @ $REF"; echo; echo "anthropic override: ${ANTHROPIC_SPEC:-none}; pytest exit code: ${PYTEST_EXIT:-not run}"; echo; cat "$RUNNER_TEMP/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          echo "----- pytest.json -----"; cat "$RUNNER_TEMP/pytest.json" 2>/dev/null || echo "(none)"
          echo "----- scan.json -----"; cat "$RUNNER_TEMP/scan.json" 2>/dev/null || echo "(none)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wirecheck-results
          path: |
            ${{ runner.temp }}/scan.json
            ${{ runner.temp }}/pytest.json
            ${{ runner.temp }}/summary.md
          if-no-files-found: ignore
